[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiedfit"
version = "0.1.0"
description = "Doppler velocities from several lines of one ion fitted together, for slit spectrographs such as Hinode/EIS"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "James McKevitt", email = "james.mckevitt.21@ucl.ac.uk"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
eis = ["eispac>=0.99"]
chianti = ["fiasco>=0.5", "astropy>=5.0"]
test = ["pytest"]

[project.urls]
Source = "https://github.com/jamesmckevitt/tiedfit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
